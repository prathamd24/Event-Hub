services:
  - type: web
    name: event-hub-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: RUN_MIGRATIONS
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.0"
