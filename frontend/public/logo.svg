<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B0082" />
      <stop offset="50%" stop-color="#800080" />
      <stop offset="100%" stop-color="#FF1493" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Hexagon slightly larger for glow -->
  <path d="M100 25 L165 62 L165 137 L100 175 L35 137 L35 62 Z" 
        fill="none" stroke="url(#grad)" stroke-width="8" filter="url(#glow)"/>

  <path d="M100 25 L165 62 L165 137 L100 175 L35 137 L35 62 Z" 
        fill="none" stroke="url(#grad)" stroke-width="6"/>
        
  <!-- Building Bars -->
  <path d="M60 140 L60 80 L75 70 L75 140 Z" fill="#6B21A8" />
  <path d="M85 140 L85 55 L105 45 L105 140 Z" fill="#86198F" />
  <path d="M115 140 L115 95 L135 105 L135 140 Z" fill="#C026D3" />
  
  <!-- Trend Arrow cutting through -->
  <path d="M50 120 L155 45" stroke="#E879F9" stroke-width="12" stroke-linecap="round"/>
  <polygon points="135 45, 160 30, 165 60" fill="#E879F9"/>
</svg>
